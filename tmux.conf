bind -n S-Enter send-keys Escape "[13;2u"

#マウス操作を有効にする
set-option -g mouse on

# スクロールアップするとコピーモードに入る
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

# 最後までスクロールダウンするとコピーモードを抜ける
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# ===== Plugins (TPM) =====
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# resurrect: ペイン内容と実行中プロセスも保存
set -g @resurrect-capture-pane-contents 'on'
# claude は復元対象に含めない: 復元がシェル経由で再実行されるため
# ~/.bashrc の claude() が --mcp-config を毎回付け足して引数が増殖する
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~node" "~python" "~python3" "~docker" "~docker-compose"'

# continuum: 自動保存(15分おき)＋tmuxサーバ起動時に自動復元
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# TPM初期化
run '~/.tmux/plugins/tpm/tpm'

# tmux-sensible が tmux-256color に設定するが、
# リモートサーバに terminfo がない場合があるため上書き
set -g default-terminal "xterm-256color"
